<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- SEO Meta Tags -->
    <title>Izzy's Bookshelf | Books, Reviews, Poems & Writing</title>
    <meta
      name="description"
      content="Explore Izzy's Bookshelf: every book she finishes, honest reviews, original poems and writing, plus a wishlist where friends can suggest the next great read."
    />
    <meta
      name="keywords"
      content="Izzy's Bookshelf, kids book reviews, children's poetry, reading tracker, young reader, book wishlist, middle grade books"
    />
    <meta name="author" content="Izzy" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Izzy's Bookshelf" />
    <meta
      property="og:title"
      content="Izzy's Bookshelf | Books, Reviews, Poems & Writing"
    />
    <meta
      property="og:description"
      content="A young reader's shelf — finished books, honest reviews, poems & stories, and a wishlist for what's next."
    />
    <meta property="og:url" content="https://izzysbookshelf.com/" />
    <meta
      property="og:image"
      content="https://izzysbookshelf.com/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta
      property="og:image:alt"
      content="Izzy's Bookshelf — a young reader with her owl friend, books, reviews, poems, and wishlist"
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Izzy's Bookshelf" />
    <meta
      name="twitter:description"
      content="Books Izzy has finished, reviews she wrote, poems & writing — plus a wishlist you can suggest books for."
    />
    <meta
      name="twitter:image"
      content="https://izzysbookshelf.com/og-image.jpg"
    />
    <meta
      name="twitter:image:alt"
      content="Izzy's Bookshelf — a young reader with her owl friend, books, reviews, poems, and wishlist"
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple Touch Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Fredoka:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Color for Mobile -->
    <meta name="theme-color" content="#d946a8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Izzy's Bookshelf" />
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root">
      <!-- Initial loading state for Lighthouse CI / SSR fallback -->
      <div
        id="initial-loader"
        style="
          min-height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #fff7eb;
        "
      >
        <div
          style="
            text-align: center;
            font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
          "
        >
          <div style="font-size: 3.5rem; margin-bottom: 0.75rem">📚</div>
          <h1 style="color: #d946a8; font-size: 1.5rem; font-weight: 600; margin: 0">
            Izzy's Bookshelf
          </h1>
          <p style="color: #78716c; margin-top: 0.5rem">Loading the shelf…</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register Service Worker -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log("SW registered:", registration.scope);
            })
            .catch((error) => {
              console.log("SW registration failed:", error);
            });
        });
      }
    </script>
  </body>
</html>
