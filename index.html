<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- SEO Meta Tags -->
    <title>Izzy's Bookshelf | Book Reviews, Poetry & Reading Adventures</title>
    <meta
      name="description"
      content="Welcome to Izzy's Bookshelf! Discover book reviews, poetry, and reading recommendations from a young book lover. Join the reading adventure!"
    />
    <meta
      name="keywords"
      content="kids books, book reviews, children's poetry, reading, young reader, book recommendations"
    />
    <meta name="author" content="Izzy" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Izzy's Bookshelf" />
    <meta
      property="og:description"
      content="Book reviews, poetry, and reading adventures from a young book lover!"
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Izzy's Bookshelf" />
    <meta
      name="twitter:description"
      content="Book reviews, poetry, and reading adventures!"
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" href="/icons/icon.svg" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Fredoka:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Color for Mobile -->
    <meta
      name="theme-color"
      content="#8b5cf6"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#1f1f23"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Izzy's Bookshelf" />

    <!-- Splash screens for iOS -->
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root">
      <!-- Initial loading state for Lighthouse CI / SSR fallback -->
      <div id="initial-loader" style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #faf5ff 0%, #f0fdfa 100%);">
        <div style="text-align: center; font-family: 'Nunito', system-ui, sans-serif;">
          <div style="font-size: 4rem; margin-bottom: 1rem;">📚</div>
          <h1 style="color: #8b5cf6; font-size: 1.5rem; font-weight: 700; margin: 0;">Izzy's Bookshelf</h1>
          <p style="color: #78716c; margin-top: 0.5rem;">Loading your reading adventure...</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register Service Worker -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker
            .register("/sw.js")
            .then((registration) => {
              console.log("SW registered:", registration.scope);
            })
            .catch((error) => {
              console.log("SW registration failed:", error);
            });
        });
      }
    </script>
  </body>
</html>
