<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6"/>
      <stop offset="100%" style="stop-color:#ec4899"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="256" fill="url(#bgGrad)"/>
  <!-- Book emoji representation -->
  <g transform="translate(128, 128) scale(2)">
    <!-- Book spine -->
    <rect x="30" y="20" width="12" height="100" rx="2" fill="#4a3728"/>
    <!-- Book cover -->
    <rect x="42" y="18" width="80" height="104" rx="4" fill="#2563eb"/>
    <!-- Book pages -->
    <rect x="46" y="22" width="72" height="96" rx="2" fill="#fef3c7"/>
    <!-- Page lines -->
    <line x1="54" y1="38" x2="110" y2="38" stroke="#d4a574" stroke-width="2"/>
    <line x1="54" y1="52" x2="110" y2="52" stroke="#d4a574" stroke-width="2"/>
    <line x1="54" y1="66" x2="100" y2="66" stroke="#d4a574" stroke-width="2"/>
    <line x1="54" y1="80" x2="105" y2="80" stroke="#d4a574" stroke-width="2"/>
    <line x1="54" y1="94" x2="95" y2="94" stroke="#d4a574" stroke-width="2"/>
    <!-- Sparkle decorations -->
    <circle cx="20" cy="30" r="6" fill="#fbbf24"/>
    <circle cx="130" cy="110" r="5" fill="#fbbf24"/>
    <circle cx="125" cy="25" r="4" fill="#f472b6"/>
  </g>
</svg>