# Netlify Configuration for Izzy's Bookshelf
#
# Production site: izzysbookshelf → izzysbookshelf.com
# Set VITE_CONVEX_URL in Netlify environment variables:
#   https://loyal-vulture-39.convex.cloud

[build]
  command = "pnpm install --frozen-lockfile && pnpm run build"
  publish = "dist"

[context.production]
  environment = { NODE_VERSION = "22" }

# Edge function for social media crawlers (WhatsApp, iMessage, Slack, etc.)
[[edge_functions]]
  function = "social-meta"
  path = "/"

[[edge_functions]]
  function = "social-meta"
  path = "/poetry/*"

[[edge_functions]]
  function = "social-meta"
  path = "/reviews/*"

[[edge_functions]]
  function = "social-meta"
  path = "/blog"

[[edge_functions]]
  function = "social-meta"
  path = "/reviews"

# SPA routing - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.convex.cloud wss://*.convex.cloud https://openlibrary.org https://covers.openlibrary.org https://www.googleapis.com https://api.giphy.com https://*.giphy.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

# Never cache index.html - ensures users always get latest version after deploy
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Cache social / brand images (WhatsApp scrapers need a stable public URL)
[[headers]]
  for = "/og-image.jpg"
  [headers.values]
    Cache-Control = "public, max-age=86400"
    Content-Type = "image/jpeg"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Cache static assets (they have hashed filenames so immutable is safe)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
