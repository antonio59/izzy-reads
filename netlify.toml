# Netlify Configuration for Izzy's Bookshelf
#
# Two Netlify sites:
# - izzysbookshelf (production) - production branch → izzysbookshelf.com
# - izzysbookshelf-staging (staging) - main branch → izzysbookshelf.antoniosmith.xyz
#
# Set VITE_CONVEX_URL in each site's environment variables:
# - Production: https://loyal-vulture-39.convex.cloud
# - Staging: https://aware-gecko-889.convex.cloud

[build]
  command = "bun run build"
  publish = "dist"

# SPA routing - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.convex.cloud wss://*.convex.cloud https://openlibrary.org https://covers.openlibrary.org https://www.googleapis.com https://api.giphy.com https://*.giphy.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
