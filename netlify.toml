# Netlify Configuration for Izzy's Bookshelf

[build]
  command = "bun run build"
  publish = "dist"

# Production context (production branch)
[context.production]
  command = "bun run build"
  [context.production.environment]
    VITE_CONVEX_URL = "https://loyal-vulture-39.convex.cloud"
    NODE_ENV = "production"

# Staging context (main branch and deploy previews)
[context.branch-deploy]
  command = "bun run build:staging"
  [context.branch-deploy.environment]
    VITE_CONVEX_URL = "https://aware-gecko-889.convex.cloud"
    NODE_ENV = "staging"

# Deploy previews (PRs)
[context.deploy-preview]
  command = "bun run build:staging"
  [context.deploy-preview.environment]
    VITE_CONVEX_URL = "https://aware-gecko-889.convex.cloud"
    NODE_ENV = "staging"

# SPA routing - redirect all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; connect-src 'self' https://*.convex.cloud wss://*.convex.cloud https://openlibrary.org https://covers.openlibrary.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self';"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
