name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # Dependabot lockfiles can include transitive packages still inside the
        # local minimumReleaseAge window; don't fail CI verification on that.
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            pnpm install --config.minimumReleaseAge=0 --config.minimumReleaseAgeStrict=false
          else
            pnpm install
          fi

      - name: Run lint
        run: pnpm run lint
        continue-on-error: true

      - name: Run type check
        run: pnpm exec tsc --noEmit

      - name: Run tests
        run: pnpm run test

      - name: Build project
        run: pnpm run build:frontend

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: dist/
          retention-days: 7

  lighthouse:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Enable pnpm via corepack
        run: corepack enable pnpm
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        # Dependabot lockfiles can include transitive packages still inside the
        # local minimumReleaseAge window; don't fail CI verification on that.
        run: |
          if [ "${{ github.actor }}" = "dependabot[bot]" ]; then
            pnpm install --config.minimumReleaseAge=0 --config.minimumReleaseAgeStrict=false
          else
            pnpm install
          fi

      - name: Build project
        run: pnpm run build:frontend

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ".lighthouserc.json"
          uploadArtifacts: true
          temporaryPublicStorage: true
