name: Update Changelog

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Commit & Push Changelog
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- CHANGELOG.md; then
            echo "No changes to commit"
            exit 0
          fi

          git add CHANGELOG.md
          git commit -m "docs: update changelog [skip ci]"

          # Concurrent pushes often land another changelog commit first.
          # During rebase, "theirs" is our commit — keep the regenerated file.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing onto latest main..."
            if ! git pull --rebase -X theirs origin "${{ github.ref_name }}"; then
              echo "Rebase conflict; keeping regenerated CHANGELOG.md"
              git checkout --theirs -- CHANGELOG.md || true
              git add CHANGELOG.md
              GIT_EDITOR=true git rebase --continue
            fi
          done

          git push
