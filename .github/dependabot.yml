version: 2

updates:
  # Enable version updates for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    # Match pnpm minimumReleaseAge (7 days). Without this, Dependabot proposes
    # packages the lockfile updater then rejects via ERR_PNPM_MINIMUM_RELEASE_AGE_*.
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    reviewers:
      - "antonio59"
    assignees:
      - "antonio59"

    # Group dependency updates
    groups:
      # Group all React-related updates together
      react:
        patterns:
          - "react*"
          - "@types/react*"

      # Group all Vite-related updates together
      vite:
        patterns:
          - "vite*"
          - "@vitejs/*"

      # Group all TypeScript updates together
      typescript:
        patterns:
          - "typescript"
          - "@typescript-eslint/*"

      # Group all testing utilities together
      testing:
        patterns:
          - "@testing-library/*"
          - "vitest"
          - "jest"

      # Group all Tailwind updates together
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
          - "autoprefixer"
          - "postcss"

  # Enable version updates for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    cooldown:
      default-days: 7
    labels:
      - "github-actions"
      - "automated"
    commit-message:
      prefix: "ci"
